<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Tax — Gerar Número</title>

  <!-- Pipedrive App Extensions SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@pipedrive/app-extensions-sdk@1/dist/app-extensions-sdk.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #fff;
      padding: 16px;
      color: #333;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header .logo {
      background: #1B5E20;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .header .title {
      font-size: 14px;
      font-weight: 600;
      color: #1B5E20;
    }

    .deal-info {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .deal-info .label { color: #888; font-size: 11px; margin-bottom: 2px; }
    .deal-info .value { font-weight: 600; color: #333; }

    .stage-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .stage-ok    { background: #E8F5E9; color: #1B5E20; }
    .stage-wrong { background: #FFF3E0; color: #E65100; }
    .stage-loading { background: #f5f5f5; color: #888; }

    .numero-atual {
      background: #E8F5E9;
      border: 1px solid #A5D6A7;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    .numero-atual .num { font-size: 20px; font-weight: bold; color: #1B5E20; }
    .numero-atual .sub { font-size: 11px; color: #555; margin-top: 2px; }

    #btn-gerar {
      width: 100%;
      background: #1B5E20;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn-gerar:hover:not(:disabled) { background: #2E7D32; }
    #btn-gerar:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .msg.success { background: #E8F5E9; color: #1B5E20; border: 1px solid #A5D6A7; }
    .msg.error   { background: #FFEBEE; color: #C62828; border: 1px solid #EF9A9A; }
    .msg.warning { background: #FFF3E0; color: #E65100; border: 1px solid #FFCC80; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <span class="logo">MT</span>
    <span class="title">Meu Tax — Número do Cliente</span>
  </div>

  <div class="deal-info">
    <div class="label">Deal</div>
    <div class="value" id="deal-title">Carregando...</div>
  </div>

  <div class="stage-badge stage-loading" id="stage-badge">
    ⏳ Verificando stage...
  </div>

  <div id="numero-container" style="display:none">
    <div class="numero-atual">
      <div class="num" id="numero-valor">—</div>
      <div class="sub">Número já gerado</div>
    </div>
  </div>

  <button id="btn-gerar" disabled>Gerar Número MTX</button>

  <div class="msg" id="msg"></div>

  <script>
    // ── CONFIGURAÇÃO ──────────────────────────────────────────────────
    // SUBSTITUA pela URL do seu GAS (termina em /exec)
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwfAKeJtGlqJZe8svKrd66xjucOaGAXTngETkfRk4_RkAxlnfwDxY5FXAnXYEHg9Ozbkw/exec';
    // ─────────────────────────────────────────────────────────────────

    let dealId = null;
    let sdk    = null;

    async function init() {
      try {
        sdk    = await new AppExtensionsSDK().initialize({ size: { height: 280 } });
        const ctx = await sdk.getContext();
        dealId = ctx.deal?.id;

        if (!dealId) {
          showMsg('Não foi possível detectar o Deal ID.', 'error');
          return;
        }

        carregarInfoDeal();
      } catch (err) {
        showMsg('Erro ao inicializar SDK: ' + err.message, 'error');
      }
    }

    function carregarInfoDeal() {
      jsonp(GAS_URL, { action: 'info', deal_id: dealId }, function(data) {
        if (data.status !== 'ok') {
          showMsg('Erro: ' + data.message, 'error');
          return;
        }

        document.getElementById('deal-title').textContent = data.title || '—';

        // Stage badge
        const badge = document.getElementById('stage-badge');
        if (data.isContractSigned) {
          badge.className = 'stage-badge stage-ok';
          badge.textContent = '✅ Contract Signed';
        } else {
          badge.className = 'stage-badge stage-wrong';
          badge.textContent = '⚠️ Stage incorreto';
        }

        // Número existente
        if (data.numeroCliente) {
          document.getElementById('numero-container').style.display = 'block';
          document.getElementById('numero-valor').textContent = data.numeroCliente;
          document.getElementById('btn-gerar').disabled = true;
          document.getElementById('btn-gerar').textContent = 'Número já gerado';
          return;
        }

        // Habilitar botão só se stage correto
        if (data.isContractSigned) {
          document.getElementById('btn-gerar').disabled = false;
        } else {
          document.getElementById('btn-gerar').disabled = true;
          showMsg('Mova o deal para "Contract Signed" antes de gerar o número.', 'warning');
        }
      });
    }

    document.getElementById('btn-gerar').addEventListener('click', function() {
      const btn = this;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Gerando...';
      hideMsg();

      jsonp(GAS_URL, { action: 'gerar', deal_id: dealId }, function(data) {
        if (data.status === 'ok') {
          document.getElementById('numero-container').style.display = 'block';
          document.getElementById('numero-valor').textContent = data.numeroCliente;
          btn.textContent = 'Número já gerado';
          showMsg('✅ ' + data.numeroCliente + ' gerado com sucesso!', 'success');
        } else if (data.status === 'exists') {
          document.getElementById('numero-container').style.display = 'block';
          document.getElementById('numero-valor').textContent = data.numeroCliente;
          btn.textContent = 'Número já gerado';
          showMsg('ℹ️ ' + data.message, 'warning');
        } else if (data.status === 'wrong_stage') {
          btn.disabled = false;
          btn.textContent = 'Gerar Número MTX';
          showMsg('⚠️ ' + data.message, 'warning');
        } else {
          btn.disabled = false;
          btn.textContent = 'Gerar Número MTX';
          showMsg('❌ ' + data.message, 'error');
        }
      });
    });

    // ── JSONP helper ─────────────────────────────────────────────────
    function jsonp(baseUrl, params, callback) {
      const cbName = '_jsonp_' + Date.now();
      window[cbName] = function(data) {
        delete window[cbName];
        const s = document.getElementById(cbName);
        if (s) s.remove();
        callback(data);
      };
      const qs = Object.entries({ ...params, callback: cbName })
        .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
        .join('&');
      const s = document.createElement('script');
      s.id  = cbName;
      s.src = baseUrl + '?' + qs;
      s.onerror = function() {
        delete window[cbName];
        s.remove();
        callback({ status: 'error', message: 'Erro de rede ao chamar o GAS' });
      };
      document.head.appendChild(s);
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      el.style.display = 'block';
    }
    function hideMsg() {
      document.getElementById('msg').style.display = 'none';
    }

    init();
  </script>
</body>
</html>
